# Copy to config.toml (gitignored) and put your own values there. Never commit config.toml.
# These are fake example values; the app never uses this file in place of config.toml.

[inbox]
# Places that work for you, matched without case. "remote" accepts remote roles; a city
# accepts on-site and "Hybrid – <city>" roles there.
locations = ["remote", "Example City"]
# Levels you're open to: junior, mid, senior, staff, principal, lead.
seniority = ["senior", "staff"]
# Yearly floor in `currency`. A role passes when the top of its range is at or above it.
salary_floor = 100000
currency = "USD"

[voice]
# Optional: a short morning brief read aloud with ElevenLabs (ADR 0013, 0014). Off unless
# enabled = true. When enabled, the script (greeting name, weather numbers, today's workout,
# job counts) is sent to ElevenLabs, which keeps it by default. The API key and the Runna
# feed address never go in this file: they live in the macOS keychain (README).
enabled = false
# An ElevenLabs voice ID; `python -m brain_dock.voice --voices` lists yours. Made-up example.
voice_id = "ExampleVoiceId123"
# Optional: the name in "Good morning, <name>". Sent to ElevenLabs as part of the script.
greeting_name = ""
# Optional: where the weather is for. Rounded to 1 decimal (about 10 km) before sending.
# These are made-up example values.
weather_latitude = 12.3
weather_longitude = -45.6
# Optional: fahrenheit (default) or celsius, for the spoken numbers.
temperature_unit = "fahrenheit"
# Optional. Leave it out to use eleven_v3 with a fallback to eleven_multilingual_v2.
# model_id = "eleven_multilingual_v2"
