[project]
name = "brain-dock"
version = "0.1.0"
description = "A personal, local-first job-search hub."
readme = "README.md"
authors = [
    { name = "Klaudia Legutko", email = "32726866+klaudialegu@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.150.0",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
