name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI only checks out code and runs tests. No secrets are used.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved; a SHA can't).
      # Dependabot (.github/dependabot.yml) proposes updates; the comment shows the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.23" # same uv as local development
          enable-cache: true

      # --locked fails if uv.lock doesn't match pyproject.toml, so CI tests exactly
      # the versions in the lock file. Python 3.12 comes from .python-version.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # filterwarnings = ["error"] in pyproject.toml: any warning fails the run.
      - name: Test
        run: uv run pytest

  # Follows the README quick start on a fresh clone, so a broken demo can't come back.
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the script clones this checkout; a shallow one can't be cloned

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.23" # same uv as local development
          enable-cache: true

      - name: README quick start on a fresh clone
        run: scripts/check_quickstart.sh

  # Starts the real server with each module turned off in turn (and all off), on demo
  # data, and checks the core still serves while the module's data stays untouched.
  modules-off:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.23" # same uv as local development
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Each module turned off in turn
        run: scripts/check_modules_off.sh

  # The Safari checklist in WebKit (Safari's engine), on a throwaway demo database
  # (docs/design/playwright-checklist-plan.md). Not a required check yet.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Microsoft's Playwright image already holds WebKit and its system packages, so there's
    # no apt step (a slow Ubuntu mirror used to stall that step until the job timed out).
    # The tag must equal the playwright version in uv.lock, and it's pinned by digest like
    # the actions below: tests/test_ci.py fails if either drifts. To update, change the tag
    # and take the new digest from:
    #   curl -sI -H "Accept: application/vnd.oci.image.index.v1+json" \
    #     https://mcr.microsoft.com/v2/playwright/python/manifests/<tag> | grep -i digest
    container:
      image: mcr.microsoft.com/playwright/python:v1.65.2-noble@sha256:38dd67fc654b56b3cba611e4c8eb71cd33750e1cd29eea2a5dc00b484817a75f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.23" # same uv as local development
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # Already in the image when the versions match, so this finds it and downloads nothing.
      - name: WebKit (from the image)
        run: uv run playwright install webkit

      - name: Browser tests
        run: uv run pytest e2e

      # One screenshot per checklist item plus index.html, also when a test failed.
      # Demo data only; deleted after 14 days.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: safari-checklist
          path: e2e-artifacts/
          retention-days: 14
