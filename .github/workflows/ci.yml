name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI only checks out code and runs tests. No secrets are used.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs (a tag can be moved; a SHA can't).
      # Dependabot (.github/dependabot.yml) proposes updates; the comment shows the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23" # same uv as local development
          enable-cache: true

      # --locked fails if uv.lock doesn't match pyproject.toml, so CI tests exactly
      # the versions in the lock file. Python 3.12 comes from .python-version.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # filterwarnings = ["error"] in pyproject.toml: any warning fails the run.
      - name: Test
        run: uv run pytest

  # Follows the README quick start on a fresh clone, so a broken demo can't come back.
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the script clones this checkout; a shallow one can't be cloned

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23" # same uv as local development
          enable-cache: true

      - name: README quick start on a fresh clone
        run: scripts/check_quickstart.sh

  # Starts the real server with each module turned off in turn (and all off), on demo
  # data, and checks the core still serves while the module's data stays untouched.
  modules-off:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.23" # same uv as local development
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Each module turned off in turn
        run: scripts/check_modules_off.sh
