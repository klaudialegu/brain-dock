<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Brain Dock{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --text: #1f2328;
      --muted: #6b6f76;
      --accent: #3b6ea8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --text: #e8e6e3;
        --muted: #9a9ea6;
        --accent: #7aa7d9;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 640px; width: 100%; }
    h1 { margin: 0 0 0.25rem; font-size: 2.5rem; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    p { margin: 0; color: var(--muted); font-size: 1.125rem; }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
