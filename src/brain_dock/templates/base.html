<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Brain Dock{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --text: #1f2328;
      --muted: #6b6f76;
      --accent: #3b6ea8;
      --card: #ffffff;
      --border: #e4e2dc;
      --badge-bg: #eceae4;
      --good: #2f7d4f;
      --bad: #a34a3d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181c;
        --text: #e8e6e3;
        --muted: #9a9ea6;
        --accent: #7aa7d9;
        --card: #1f2227;
        --border: #2e3238;
        --badge-bg: #2a2e34;
        --good: #6cc191;
        --bad: #e08a7c;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    main { max-width: 640px; width: 100%; }
    .page-wide { align-items: flex-start; }
    .page-wide main { max-width: 960px; padding-top: 1rem; }
    nav { margin-bottom: 1.5rem; font-size: 0.875rem; color: var(--muted); }
    nav a { color: var(--accent); text-decoration: none; }
    nav a[aria-current="page"] { color: var(--text); font-weight: 600; }
    h1 { margin: 0 0 0.25rem; font-size: 2.5rem; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    p { margin: 0; color: var(--muted); font-size: 1.125rem; }
    .clocks {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 2rem;
    }
    .clock {
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .clock .city { color: var(--muted); font-size: 0.875rem; }
    .clock .time { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }
    .clock .day { min-height: 1.25rem; color: var(--accent); font-size: 0.8125rem; }
    .page-wide h1 { font-size: 2rem; }
    .page-wide p { margin-bottom: 1rem; font-size: 1rem; }
    .table-wrap {
      overflow-x: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.9375rem; }
    th, td { padding: 10px 14px; text-align: left; white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; font-size: 0.8125rem; border-bottom: 1px solid var(--border); }
    tbody tr + tr td { border-top: 1px solid var(--border); }
    td a { color: var(--accent); }
    td.date { font-variant-numeric: tabular-nums; }
    .stage {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--badge-bg);
      font-size: 0.8125rem;
    }
    .stage-offer { color: var(--good); font-weight: 600; }
    .stage-rejected, .stage-ghosted, .stage-withdrawn { color: var(--muted); }
    .stage-interview, .stage-onsite, .stage-screen { color: var(--accent); }
    code { font-size: 0.875em; }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">
  <main>
    <nav aria-label="Main">
      <a href="/"{% if request.url.path == "/" %} aria-current="page"{% endif %}>Home</a>
      ·
      <a href="/applications"{% if request.url.path == "/applications" %} aria-current="page"{% endif %}>Applications</a>
    </nav>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
