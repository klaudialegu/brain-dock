<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Brain Dock{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/stages.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  <main>
    <nav aria-label="Main">
      <a href="/applications"{% if request.url.path == "/applications" %} aria-current="page"{% endif %}>Applications</a>
      ·
      <a href="/applications/new"{% if request.url.path == "/applications/new" %} aria-current="page"{% endif %}>Add application</a>
    </nav>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
