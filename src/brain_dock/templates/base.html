<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Brain Dock{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/stages.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  <main>
    {% if request.app.state.is_demo %}
    <p class="demo-banner" role="status">You're looking at fake demo data (<code>data/demo.db</code>). Your own data lives in <code>data/brain_dock.db</code>.</p>
    {% endif %}
    <nav aria-label="Main">
      <a href="/applications"{% if request.url.path == "/applications" %} aria-current="page"{% endif %}>Applications</a>
      ·
      <a href="/applications/new"{% if request.url.path == "/applications/new" %} aria-current="page"{% endif %}>Add application</a>
    </nav>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
