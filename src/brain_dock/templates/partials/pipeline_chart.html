{# The Sankey pipeline. `data` comes from charts.pipeline_chart_data(); drawn by static/pipeline.js. #}
{% macro pipeline_chart(data, summary) -%}
<section class="pipeline" aria-labelledby="pipeline-heading">
  <h2 id="pipeline-heading">Pipeline</h2>
  {% if data.links %}
  <div id="pipeline-chart" class="pipeline-chart" role="img" aria-label="Pipeline: {{ summary }}"></div>
  <script type="application/json" id="pipeline-data">{{ data | tojson }}</script>
  <script src="/static/vendor/echarts-6.1.0/echarts.min.js" defer></script>
  <script src="/static/pipeline.js" defer></script>
  {% else %}
  <p class="stat-note">The pipeline appears once an application moves past Applied.</p>
  {% endif %}
</section>
{%- endmacro %}
