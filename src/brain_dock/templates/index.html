{% extends "base.html" %}

{% block content %}
<h1>Brain <span>Dock</span></h1>
<p>Everything lands here. One step at a time.</p>

<section class="clocks" aria-label="World clocks" data-reference-tz="{{ reference_tz }}">
  {% for clock in clocks %}
  <div class="clock" data-tz="{{ clock.tz }}">
    <div class="city">{{ clock.city }}</div>
    <div class="time">{{ clock.time }}</div>
    <div class="day">{{ clock.day or "" }}</div>
  </div>
  {% endfor %}
</section>

<script src="/static/clocks.js" defer></script>
{% endblock %}
