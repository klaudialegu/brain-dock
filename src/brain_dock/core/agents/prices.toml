# Model prices in US dollars per million tokens (MTok), for the ledger and budgets (ADR 0008).
# Each model says where its prices came from and when. A value listed in `estimates` was not
# read from a source; the live client (harness PR 9) refuses a model with estimated prices.
# A token at a price of P dollars per MTok costs P micro-dollars, which is how costs are stored.

[models."claude-haiku-5-5"]
source = "Claude API reference, model table (cached 2026-10-06)"
verified_on = "2026-10-26"
input = "0.10"
output = "0.50"
cache_read = "0.01"     # estimate: 0.1 x input
cache_write = "0.125"   # estimate: 1.25 x input (5-minute cache)
estimates = ["cache_read", "cache_write"]
# These prices hold up to 100K input tokens; above that, $0.50 / $2.50 (not modeled, so refused).
priced_up_to_input_tokens = 100000

[models."claude-sonnet-5-5"]
source = "Claude API reference, model table and model notes (cached 2026-10-06)"
verified_on = "2026-10-26"
input = "2.00"
output = "10.00"
cache_read = "0.20"
cache_write = "2.50"    # estimate: 1.25 x input (5-minute cache)
estimates = ["cache_write"]

[models."claude-opus-5-5"]
source = "Claude API reference, model table and model notes (cached 2026-10-06)"
